# IAM schema bootstrap (one-shot, after this Postgres is healthy — not on Nest init):
#   npm run prisma:iam:bootstrap
#   npm run iam:rbac-v1:apply   # once; do not run on every app start
#   npm run start:iam
# Gateway/IAM health: GET /health/live and GET /health/ready (IAM HTTP on IAM_HEALTH_PORT).
# Run migrate+seed in a single deployment job when scaling replicas.
services:
  postgres:
    image: postgres:17-alpine
    container_name: memora-postgres
    restart: unless-stopped

    ports:
      - '127.0.0.1:5432:5432'

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - memora_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  memora_pgdata:
