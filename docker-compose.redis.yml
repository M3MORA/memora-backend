services:
  redis:
    image: redis:7-alpine
    container_name: memora-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - memora_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  memora_redisdata:
